spring:
  application:
    name: poolfolio-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/poolfolio_db}
    username: ${SPRING_DATASOURCE_USERNAME:poolfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:poolfolio_local_pw}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-to-a-long-random-secret-at-least-256-bits-for-hs256-signing-please}
    expiration-ms: 86400000
